name: Publish package

on:
  workflow_call:
    inputs:
      path:
        description: Package directory to publish (e.g. packages/ltd-savedata)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.path }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm + JSR
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install -g npm@latest

      - run: npm ci

      - name: Resolve package
        id: pkg
        run: echo "name=$(basename "${{ inputs.path }}")" >> "$GITHUB_OUTPUT"

      - name: Build workspace dependencies
        if: steps.pkg.outputs.name == 'ltd-sharemii'
        run: npm run build --workspace @alexislours/ltd-savedata

      - run: npm run build --workspace @alexislours/${{ steps.pkg.outputs.name }}
      - run: npm run check --workspace @alexislours/${{ steps.pkg.outputs.name }}
      - run: npm run lint:pkg --workspace @alexislours/${{ steps.pkg.outputs.name }}
      - run: npm run test --workspace @alexislours/${{ steps.pkg.outputs.name }} --if-present

      - run: npm publish --workspace @alexislours/${{ steps.pkg.outputs.name }} --provenance --access public --ignore-scripts

      - name: Publish to JSR
        working-directory: ${{ inputs.path }}
        run: npx --yes jsr@latest publish --allow-dirty
